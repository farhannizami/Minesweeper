<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>
  <link href="images/logo.png" rel="icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500&display=swap" rel="stylesheet">
</head>

<body>
  <div class="app-shell">
    <div class="navigation" id="navigation">
      <nav class="navbar navbar-light">
        <div class="container-fluid d-flex justify-content-center">
          <a class="navbar-brand gamename" href="index.html">
            <img src="images/logo.png" alt="" width="40" height="40" class="d-inline-block align-text-top">
            Minesweeper
          </a>
        </div>
      </nav>

      <ul class="nav nav-tabs nav-justified" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="play-tab" data-bs-toggle="tab" data-bs-target="#play" type="button"
            role="tab" aria-controls="play" aria-selected="true">Play</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="leaderboard-tab" data-bs-toggle="tab" data-bs-target="#leaderboard" type="button"
            role="tab" aria-controls="leaderboard" aria-selected="false">Leaderboard</button>
        </li>
      </ul>
    </div>

    <div class="tab-content gametab d-flex justify-content-center align-items-center" id="myTabContent">
      <div class="tab-pane fade show active" id="play" role="tabpanel" aria-labelledby="play-tab">
        <div class="gamebox">
          <div class="gametopbar">
            <div class="gamehead d-flex justify-content-center align-items-center">
              <i class="bi bi-flag-fill" aria-hidden="true"></i>
              <span id="flagcounter" class="counter-value">15</span>
              <span class="timer-wrap">
                <i class="bi bi-stopwatch-fill" aria-hidden="true"></i>
                <span id="timer" class="counter-value">000</span>
              </span>
            </div>
          </div>
          <div class="gridgg" aria-label="Minesweeper board"></div>
        </div>
      </div>

      <div class="tab-pane fade" id="leaderboard" role="tabpanel" aria-labelledby="leaderboard-tab">
        <div class="container">
          <div class="row d-flex justify-content-center">
            <div class="col-lg-6">
              <h1 class="d-flex justify-content-center leaderhead">Leaderboard</h1>
              <div class="playerinfo" id="playerinfo" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="gameover-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="gameover-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="gameover-title">Game Over</h5>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn play-again"><i class="bi bi-arrow-clockwise"></i>Try Again</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="win-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="win-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="win-title">Congratulations</h5>
        </div>
        <div class="modal-body">
          <p><span class="fw-semibold">Time Taken:</span> <span id="win-time">000</span> seconds</p>
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Enter Your Name:</label>
            <input type="text" class="form-control" id="name" maxlength="24" autocomplete="nickname" required>
            <div class="form-text" id="submit-status"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn submit">Submit</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
